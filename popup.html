<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    :root { --brand1: #4f7cff; --brand2: #8b5cf6; --ink: #1f2937; --muted: #6b7280; --line: #e5e7eb; }
    * { box-sizing: border-box; }
    body { width: 340px; margin: 0; color: var(--ink); background: linear-gradient(180deg, #eef2fb 0%, #f7f9fd 100%); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    header { padding: 8px 14px 9px; color: #fff; background: linear-gradient(135deg, var(--brand1) 0%, var(--brand2) 100%); }
    header h3 { display: flex; align-items: center; gap: 6px; margin: 0; font-size: 14.5px; font-weight: 700; }
    header .logo { font-size: 15px; line-height: 1; }
    header p { margin: 1px 0 0 21px; font-size: 10.5px; font-weight: 500; opacity: .82; }
    main { display: flex; flex-direction: column; gap: 7px; padding: 9px 11px 11px; }
    .card { padding: 8px 10px 9px; background: #fff; border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 2px 8px rgba(31, 41, 55, .06); animation: rise .18s ease-out; }
    .card > :last-child { margin-bottom: 0; }
    @keyframes rise { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
    label { display: block; margin: 0 0 2px; font-size: 10px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
    input[type="password"] { width: 100%; padding: 6px 9px; margin: 0 0 7px; font-family: inherit; font-size: 12px; color: var(--ink); background: #fbfcfe; border: 1px solid #dfe3ec; border-radius: 8px; transition: border-color .15s, box-shadow .15s, background .15s; }
    input[type="password"]:focus { outline: none; background: #fff; border-color: #9db8f8; box-shadow: 0 0 0 3px rgba(79, 124, 255, .14); }
    button { position: relative; width: 100%; padding: 8px 10px; margin-top: 2px; font-family: inherit; font-size: 12.5px; font-weight: 700; color: #fff; cursor: pointer; background: linear-gradient(135deg, var(--brand1) 0%, var(--brand2) 100%); border: none; border-radius: 9px; box-shadow: 0 2px 6px rgba(79, 124, 255, .28); transition: filter .15s, box-shadow .15s, transform .1s; }
    button:hover { filter: brightness(1.07); box-shadow: 0 4px 12px rgba(79, 124, 255, .34); }
    button:active { transform: translateY(1px); }
    button.secondary { color: #3f4a5c; background: #fff; border: 1px solid #dfe3ec; box-shadow: 0 1px 3px rgba(31, 41, 55, .08); }
    button.secondary:hover { filter: none; border-color: #c3cfeb; }
    button .btn-label { transition: opacity .18s ease; }
    .btn-check { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 15px; opacity: 0; transform: scale(.65); transition: opacity .18s ease, transform .18s ease; }
    button.saved { color: #fff; background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%); border-color: transparent; box-shadow: 0 2px 8px rgba(22, 163, 74, .35); }
    button.saved .btn-label { opacity: 0; }
    button.saved .btn-check { opacity: 1; transform: scale(1); }
    .footnote { min-height: 41px; margin: 0; padding: 6px 9px; font-size: 10px; line-height: 1.35; color: #6b7280; background: #f1f4fb; border: 1px solid #e3e9f7; border-radius: 10px; transition: background .18s ease, border-color .18s ease, color .18s ease; }
    .footnote b { color: #4b5563; }
    .footnote.error { color: #b91c1c; background: #fef2f2; border-color: #fecaca; }
  </style>
</head>
<body>
  <header>
    <h3><span class="logo">🛡️</span>Jev Projects Review</h3>
    <p>inspect a page · percentage per category</p>
  </header>
  <main>
    <section class="card">
      <label for="apiKey">TypeSafe Jev API token</label>
      <input type="password" id="apiKey" placeholder="jev_live_...">
    </section>
    <button id="inspectBtn" aria-label="Inspect the current page">🔍 Inspect this page</button>
    <button id="saveBtn" class="secondary" aria-label="Save settings">
      <span class="btn-label">Save settings</span>
      <span class="btn-check" aria-hidden="true">✓</span>
    </button>
    <p class="footnote" id="footnote"><b>Tip:</b> press “Inspect this page” — or use the right-click menu item “Jev: inspect page” — to draw the percentage card on the page.</p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
